<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{common/layouts/baseLayout}">
<div layout:fragment="content" class="inner">
    <div id="main-container">
        <div class="notice-box electric">
            <div class="title-wrap">
                <div class="title-left">
                    <img src="/imgs/main/ic_fill_electric.svg" alt="전자결재아이콘">
                    <h1 class="body-md font-bold">전자결재</h1>
                    <p class="caption-xxs font-medium check-electric">확인하지 않은 결재 (7)</p>
                </div>
                <a href="" class="show-all">전체보기</a>
            </div>
            <div class="list-wrap">
                <ul class="list-left">
                    <li>[긴급] 촬영 기획 기안서</li>
                    <li>2024.12.24(금) 09:42</li>
                    <li class="writer-info">
                        <div class="avatar-wrap">
                            <img src="/imgs/202301261737390.jpg" alt="" class="avatar">
                            <span class="first-name">김</span>
                        </div>
                        <span>김지훈</span>
                    </li>
                </ul>
                <a href="">자세히 보기></a>
            </div>
        </div>
        <div class="notice-box schedule">
            <div class="title-wrap">
                <div class="title-left">
                    <img src="/imgs/main/ic_fill_calender.svg" alt="스케줄">
                    <h1 class="body-md font-bold">스케줄</h1>
                </div>
                <a href="" class="show-all">전체보기</a>
            </div>
            <div class="list-wrap">
                <div class="list-left">
                    외부인 내부 방문시 필요서류
                </div>
                <div class="write-date">
                    <p>2024.12.24(금) 09:42</p>
                </div>
            </div>
        </div>
        <div class="notice-box notice">
            <div class="title-wrap">
                <div class="title-left">
                    <img src="/imgs/main/ic_fill_notice.svg" alt="공지사항">
                    <h1 class="body-md font-bold">공지사항</h1>
                </div>
                <a href="" class="show-all">전체보기</a>
            </div>
            <div class="list-wrap notice">
                <div class="list-left">
                    외부인 내부 방문시 필요서류
                </div>
                <div class="write-date">
                    <p>2024.12.24(금) 09:42</p>
                </div>
            </div>
        </div>
    </div>
</div>
</html>
