<html
        lang="ko"
        xmlns:th="http://www.thymeleaf.org"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{common/layouts/adminLayout}"
>
<div layout:fragment="content" class="inner admin">
    <section class="edit-img-section">
        <!-- 프로필 이미지 -->
        <div class="edit-img">
            <h1 class="edit-img-title">프로필 이미지</h1>
            <label for="editSymbolImg"></label>
            <input type="file" name="" id="editSymbolImg" class="edit-img-input"/>
        </div>
    </section>

    <!-- 정보 -->
    <section class="profile-wrap">
        <div class="detail-wrap">
            <h1>개인정보</h1>
            <div class="personal-info profile">
                <div class="info-item profile-name">
                    <p>이름</p>
                    <p>김지호</p>
                </div>
                <div class="info-item profile-email">
                    <p>메일</p>
                    <p>rlawlgh486@gmail.com</p>
                </div>
                <div class="info-item profile-tel">
                    <p>전화번호</p>
                    <p>-</p>
                </div>
                <div class="info-item profile-phone">
                    <p>핸드폰번호</p>
                    <p>010-9876-4321</p>
                </div>
                <div class="info-item profile-contract">
                    <p>계약형태</p>
                    <p>정규직</p>
                </div>
                <div class="info-item profile-birth">
                    <p>생일</p>
                    <p>1999년 9월 9일</p>
                </div>
            </div>
        </div>

        <div class="detail-wrap">
            <h1>조직</h1>
            <div class="personal-info dept">
                <div class="info-item dept-name">
                    <p>부서</p>
                    <p>디자인팀</p>
                </div>
                <div class="info-item duty">
                    <p>직무</p>
                    <p>BX 디자이너</p>
                </div>
            </div>
        </div>
        <button class="primary-btn profile-edit-btn">
            <span>수정하기</span>
        </button>
    </section>

    <section class="terms-agree">
        <ul>
            <li><span>마케팅 이용 • 수신 동의 변경하기</span></li>
            <li><span>비밀번호 변경하기</span></li>
            <li><span>회원 탈퇴하기</span></li>
        </ul>
    </section>
</div>

<th:block layout:fragment="pageScripts"></th:block>
</html>
