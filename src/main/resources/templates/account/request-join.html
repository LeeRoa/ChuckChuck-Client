<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<th:block th:replace="~{common/fragments/config :: configFragment}"></th:block>
<body>
<div class="sign-container">
    <div class="title-head">
        <h1 class="title-xl font-bold join">가입요청 보내기</h1>
        <p>해당 정보로 회사에 가입요청을 보내시겠습니까?</p>
    </div>
    <form action="" id="joinForm" class="result-form">
        <div class="result-box join">
            <span id="resultEmail"></span>
            <span id="resultName"></span>
        </div>
        <p id="confirmMsg" class="message"></p>
    </form>
    <button id="requestJoinBtn" class="primary-btn long request-btn" form="joinForm">
        <span>가입 요청 보내기</span>
    </button>
    <button id="goLoginBtn" class="primary-btn long go-login">
        <span>로그인하러 가기</span>
    </button>
    <a href="/join/set-password" class="text-btn back">돌아가기</a>
</div>
<th:block th:insert="~{common/fragments/accountFooter :: accountFooterFragment}"></th:block>

<script layout:fragment="pageScripts" src="/js/account/common.js"></script>
<script layout:fragment="pageScripts" src="/js/account/requestJoin.js"></script>
</body>
</html>
